<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Unavailable</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0b0b0b;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .notice-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 40px 25px;
      border-radius: 16px;
      max-width: 450px;
    }
    h1 {
      color: #d4af37;
      font-size: 1.5rem;
      margin-bottom: 15px;
    }
    p {
      color: #a0a0a0;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="notice-card">
    <h1>Website Temporarily Unavailable</h1>
    <p>This website is currently offline for scheduled maintenance. Please check back later or contact management directly for inquiries.</p>
  </div>
</body>
</html>
